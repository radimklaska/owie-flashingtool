name: Link Checker

# Checks the links in the published site (site/) on PRs, weekly, and on demand.
# Sites that block CI runners (403/429) go into --exclude with a comment saying why.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir site/
            site/
          fail: true
